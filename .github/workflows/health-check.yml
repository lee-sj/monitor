name: Health Check

on:
  schedule:
    - cron: "17 * * * *"  # 매시 17분 (정각은 몰려서 더 밀림)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure labels
        run: |
          gh label create outage --color d73a4a --description "헬스체크 실패" --force
          gh label create cold-start --color fbca04 --description "잠들었다가 깨어남 (keep-alive 중단)" --force
          gh label create job-stalled --color b60205 --description "자동 작업 멈춤" --force

      - name: Check targets
        run: bash scripts/check.sh

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "chore: health check $(date -u +%FT%TZ)"
          git pull --rebase && git push
