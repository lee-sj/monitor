<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="page-header">
    <h1>Monitor</h1>
    <p class="subtitle">서버 응답과 자동 작업 상태 · 시간은 한국 시간(KST)</p>
  </header>

  <main id="groups">
    <p class="notice">불러오는 중…</p>
  </main>

  <footer class="page-footer">
    <p>기록은 GitHub Actions가 약 1시간마다 남기며, 실제 실행 간격은 밀릴 수 있습니다.</p>
  </footer>

  <template id="group-template">
    <section class="group">
      <div class="group-head">
        <h2 class="group-title"></h2>
        <p class="group-desc"></p>
        <p class="group-legend"></p>
      </div>
      <div class="group-targets"></div>
    </section>
  </template>

  <template id="target-template">
    <article class="target">
      <div class="target-head">
        <h3 class="target-name"></h3>
        <span class="badge"></span>
      </div>
      <p class="target-meta"></p>

      <dl class="stats"></dl>

      <h4>최근 확인</h4>
      <div class="timeline" role="img"></div>

      <h4 class="events-title"></h4>
      <div class="table-wrap">
        <table class="events">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="empty-events" hidden></p>
    </article>
  </template>

  <script src="assets/app.js"></script>
</body>
</html>
